# [modules.lab.profile]: an example instance profile for a launcher script `bin/launch.py` that keeps instances in
# `instances/<name>`, each with a `server/` and a `client/` side and a manifest `instance.json`.
# Required: launcher, instances, prepare, play. Every key: modules/lab/wb_lab/profile.py.
launcher = "bin/launch.py"
instances = "instances"
prepare = ["{python}", "bin/launch.py", "new", "{name}"]
seed_flag = "--seed"
play = ["{python}", "bin/launch.py", "run", "{name}", "--route", "{tour}", "--size", "{window}"]
play_open = ["{python}", "bin/launch.py", "run", "{name}", "--size", "{window}"]  # optional: lab.play with no tour
options_env = "JAVA_TOOL_OPTIONS"
load = ["{python}", "bin/launch.py", "check", "{name}"]     # optional: refuse an instance that would not load
load_ok = "OK"
collect = [["client/logs/latest.log", "client-log"]]         # copied out after every play
captures_pattern = "captures in (.+)"                       # play prints where its screenshots went
recipe_files = ["bin/launch.py", "launch.lock", "{engine}/build.lock"]
file_flags = ["--mod"]                                      # prepare arguments that name files
manifest = "instance.json"
world_key = { seed = "seed", rules = "#world.rules" }       # what a world snapshot must match
world_writer = "engine.sha256"                              # the build that writes worlds
world_parts = ["server/world"]
rewrite = ["instance.json"]                                 # files that hold the instance's own path and name
linkable_dirs = ["server/libraries"]                        # read-only: shared by hard link
linkable_suffixes = [".jar"]
# lab.inputs: steps that bring the launch set to its state before lab.ensure, in order ({python}, {cwd}); a step
# runs in the launcher checkout, or in one checkouts names. A machine layer can add env values only it knows.
inputs = [
  { name = "pins", run = ["{python}", "bin/setup.py"] },
  { name = "engine", checkout = "engine", run = ["{cwd}/build.sh"] },
]
# What the launch set's projects share, and where each pins it (group 1: the commit). lab.inputs reports pins that
# disagree and lab.ensure refuses them (allow_disagreement=true builds anyway, as a finding). Better, where you can:
# pin a shared dependency once and read it through a chain of checkout pins (below), so nothing can disagree.
agree = { physics = [
  { file = "launch.lock", pattern = 'physics@([0-9a-f]{7,40})' },
  { checkout = "engine", file = "build.lock", pattern = '"physics": "([0-9a-f]{7,40})"' },
] }

[checkouts]                                                 # other checkouts, named in paths as {name}
engine = "../Engine"                                        # a folder, read as it is
# Or read at a commit, from a snapshot that is never moved (wb_lab/snapshots.py): the launcher's own checkout at a
# branch, fetched before each job, and a checkout at the commit another one pins (the launcher's, or one above it):
#   checkout = { repo = '../MyLauncher', ref = "origin/main", fetch = true }
#   engine = { repo = "../Engine", pin = { file = "engine.lock.json", key = "commit" } }
#   physics = { repo = "../Physics", pin = { checkout = "engine", file = "build.lock", key = "physics" } }
