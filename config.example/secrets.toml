# [secrets]: names for files that are mounted read-only into the container. Values never appear in config, logs
# or results. Commands ask for them by name (vast needs vast_api_key and vast_ssh_key).

[vast_api_key]
host = '~/.config/vastai/vast_api_key'

[vast_ssh_key]
host = '~/.ssh/vast_lab'

[vast_ssh_pub]
host = '~/.ssh/vast_lab.pub'
