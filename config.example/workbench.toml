# Workbench Reloaded config: copy this folder to ~/.config/wb (Windows: %USERPROFILE%\.config\wb) and edit.
#
# This root file may hold everything. Files in subfolders are layered over it, and the deeper file wins: a file's
# path is its namespace, so core/logging.toml fills [core.logging] and modules/vast.toml fills [modules.vast].
# Unknown keys and wrong types stop the daemon with the file and line that set them.
# `wb config show --origin` prints every value with the file that set it.

[core.config]
# layers = ['../team-config']   # shared config folders this one lies over, merged first (relative to this folder)

[core.api]
port = 7377            # published on 127.0.0.1 only; `wb up` refuses anything wider

[core.budget]
# cpu_cores = 8        # CPU jobs share this budget (default: every core the container sees)
# mem_gb = 12

[core.retention]
days = 30              # rolled logs, job folders and unreferenced artifacts; results and the ledger are kept

[runner]
# The Windows host runner (`wb host serve`): local GPU game sessions on this PC's card.
lab_home = '../Lab'    # relative to the Workbench checkout
# To share a GPU lease and lanes with another tool on this PC:
# lease_file = 'D:\work\locks\native-measurement.lock'  # scrub: allow
# coordination_dir = 'D:\work\coordination'  # scrub: allow

[lab]
# The game lab on this machine (wb setup asks for each key it lacks).
# home = ''              # instances, sessions, the lease and lanes; empty: [runner] lab_home
trusted = []             # projects whose configure hooks and drivers may run here, e.g. ['riven', 'cubature']
eula = false             # true: you accept the Minecraft EULA for the instances built here (eula.txt is written)
# Old tools join a held lease by their own variable names; a session's driver gets the values in these too:
# [lab.env]
# CUBIC_LAB_TURN_LEASE = 'token'
# GPU_QUEUE_LANE = 'lane'
