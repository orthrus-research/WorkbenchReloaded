name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: python -m pip install numpy pillow
      - run: python tests/run_all.py
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 image/pins.py check
      - run: docker build -f image/Dockerfile -t wb-core:ci .
      - run: docker run --rm --entrypoint python3 wb-core:ci -m wb_core --check --config /opt/wb/src/config.example
