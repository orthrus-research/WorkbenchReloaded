# Every third-party input of the image and of a rental's bootstrap, pinned by SHA-256 (spec S17, D20, D21).
# `python image/pins.py lock` regenerates image/jdks.lock from this file; a test checks the two agree.

[base]
image = "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db"
# apt reads the archive as it was at this instant (snapshot.ubuntu.com), so a rebuild installs the same packages.
apt_snapshot = "20261120T000000Z"

# Temurin builds (Adoptium publishes a SHA-256 for each). Keys are what commands ask for: jdk = "26".
[jdk.8]
version = "1.8.0_514-b01"
url = "https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u514-b01/OpenJDK8U-jdk_x64_linux_hotspot_8u514b01.tar.gz"
sha256 = "27eda854481d20806d918b30cdd417c6bed4fd15882e24f3595dc8ae7fb5d095"

[jdk.17]
version = "17.0.21.1+2"
url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21.1%2B2/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21.1_2.tar.gz"
sha256 = "0b0ac5eab6db6abaec68c9913bcddb31321e5da411c45073d520d9c125e6f7b4"

[jdk.25]
version = "25.0.5.1+2-LTS"
