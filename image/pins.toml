# Optional tools for repositories outside Minecraft modding. An image builds in only the ones the machine's
# [core.image] tools names (`wb build` passes them), each checked by its SHA-256 and linked into /opt/tools/bin.
# bin: the archive's folders whose programs go on PATH.
[tool.node]
version = "26.13.1"
url = "https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz"
sha256 = "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864"  # nodejs.org's SHASUMS256.txt
bin = ["bin"]

[tool.zig]
version = "0.17.1"
url = "https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz"
sha256 = "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"  # ziglang.org's download index
bin = ["."]

[virtualgl]
# For rentals only (the local container never draws on the GPU, S16).
version = "3.1.1"
url = "https://github.com/VirtualGL/virtualgl/releases/download/3.1.1/virtualgl_3.1.1_amd64.deb"
sha256 = "796866b5a84dc47e57e9d45f5ea621c9dbc49a26344b89111a63d39ec8fc2184"  # computed 2026-11-21 from the release asset

[apt]
# System packages of the image, from the snapshot above.
image = [
  "ca-certificates", "curl", "wget", "git", "openssh-client", "xz-utils", "zip", "unzip", "procps",
  "gpg", "gpg-agent",  # release.publish signs what a central channel sends to Maven Central
  "python3", "python3-venv", "python3-numpy", "python3-scipy", "python3-pil",
  "ffmpeg", "xvfb", "xauth", "mesa-utils", "libegl1", "libegl-mesa0", "libgl1", "libgl1-mesa-dri",
  "libglu1-mesa", "libvulkan1", "glslang-tools", "fonts-dejavu-core",
]
# What a rented machine's bootstrap may install, by need, from the snapshot above (so a rebuild installs the same
# versions).
rental_base = ["ca-certificates", "wget", "python3", "procps", "xz-utils"]
# The display (Xvfb) and the game client's own libraries: for a bundle that draws, on the GPU or not.
rental_display = ["xvfb", "xauth", "mesa-utils", "libegl1", "libgl1", "libglx0", "libglu1-mesa", "libxrandr2",
                  "libxcursor1", "libxi6", "libxinerama1", "libxxf86vm1", "libxtst6", "libxrender1", "libxext6",
                  "libx11-6", "libasound2t64", "libfreetype6", "libfontconfig1"]
# Mesa's software OpenGL (llvmpipe) for a bundle that draws without a GPU (needs.display, no needs.gpu); a GPU
# bundle draws through the driver's own libraries and VirtualGL instead.
rental_software_gl = ["libgl1-mesa-dri", "libglx-mesa0", "libegl-mesa0"]
