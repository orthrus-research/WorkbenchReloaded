// A build that calls Workbench: the conformance suite runs `gradle -p sdk/gradle/sample wbEcho wbFindingAllowed`.
plugins { id 'cc.orthrus.wb' }

tasks.register('wbEcho', cc.orthrus.wb.gradle.WbTask) {
    command = 'selftest.echo'
    params = [text: 'gradle', times: 2]
}

tasks.register('wbFindingAllowed', cc.orthrus.wb.gradle.WbTask) {
    command = 'selftest.fail'
    params = [outcome: 'finding']
    failOn('usage', 'environment')
}

tasks.register('wbFindingFails', cc.orthrus.wb.gradle.WbTask) {
    command = 'selftest.fail'
    params = [outcome: 'finding']
}
