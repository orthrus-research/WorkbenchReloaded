// A build that calls Workbench: the conformance suite runs `gradle -p sdk/gradle/sample wbEcho wbFindingAllowed`.
plugins {
    id 'java'
    id 'cc.orthrus.wb'
}

tasks.register('wbEcho', cc.orthrus.wb.gradle.WbTask) {
    command = 'selftest.echo'
    params = [text: 'gradle', times: 2]
}

tasks.register('wbFindingAllowed', cc.orthrus.wb.gradle.WbTask) {
    command = 'selftest.fail'
    params = [outcome: 'finding']
    failOn('usage', 'environment')
}

tasks.register('wbFindingFails', cc.orthrus.wb.gradle.WbTask) {
    command = 'selftest.fail'
    params = [outcome: 'finding']
}

// WbRun needs no Workbench: an entry point on the build's class path, with a receipt in build/wb/<task>.run.json.
tasks.register('wbRunHello', cc.orthrus.wb.gradle.WbRun) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'sample.Hello'
    args 'gradle'
    singleProvider = ['sample.Hello']
}

tasks.register('wbRunPinned', cc.orthrus.wb.gradle.WbRun) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'sample.Hello'
    pin('settings.gradle', '0' * 64)   // never these bytes: the run is refused before it starts
}

tasks.register('wbRunFails', cc.orthrus.wb.gradle.WbRun) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'sample.Hello'
    args 'fail'
}
