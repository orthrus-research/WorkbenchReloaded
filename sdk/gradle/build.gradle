// The Workbench Gradle plugin: a build calls Workbench commands as tasks and reads typed envelopes (D24).
// It compiles the JDK-only Java client from ../java together with the plugin, so it needs nothing else.
plugins {
    id 'java-gradle-plugin'
}

group = 'cc.orthrus'
version = '0.1.0'

sourceSets {
    main { java { srcDir '../java/src/main/java' } }
}

gradlePlugin {
    plugins {
        wb {
            id = 'cc.orthrus.wb'
            implementationClass = 'cc.orthrus.wb.gradle.WbPlugin'
            displayName = 'Workbench Reloaded'
            description = 'Run Workbench commands as Gradle tasks and gate builds on their outcomes; run entry points ' +
                    'on a prepared class path with a receipt (WbRun).'
        }
    }
}

// Bytecode for Java 17 from whatever JDK runs Gradle: any modern build can apply the plugin.
tasks.withType(JavaCompile).configureEach { options.release = 17 }

// The same JAR from the same sources and JDK on every machine, so a local repository can hold it by its SHA-256
// (toolchain.repo-add never replaces bytes it holds).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
