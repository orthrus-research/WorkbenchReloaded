# An example bundle template: one game instance prepared and its tours played on a rented GPU.
# In a config folder this file is modules/vast/templates/tours.toml, which fills [modules.vast.templates.tours]. Its
# folder holds the entry script, tours/run.sh beside this file. Every key: ../templates.md.
summary = "One game instance prepared and its tours played on a rented GPU"
folder = "bundles/tours"            # relative to the machine's [modules.vast] root, or absolute
script = "run.sh"
purpose = "measurement"
needs = { jdk = ["26"], gpu = true, disk_gb = 32 }

# How vast.rent watches the run, and what it fetches.
[run]
args = ["/root/bundle"]
progress = "^RUN "
done = "RUN done"
failed = '^RUN tour .* exit [^0]'
results = ["/root/bundle/results.tar", "/root/run.log"]
stop = "pkill -f launcher.py"
partial = "cd /root/bundle && tar -cf results.tar results"
unpack = ["results.tar"]

# The input archives, by file name. vast.lab-inputs builds those with a recipe from their pinned commits; give each
# its sha256 once it is known, and a drifted archive is refused before anything is rented.
[inputs."app.tar"]
repo = "App"                        # relative to [modules.vast] root, or absolute; only read
commit = "9c1d4e7b2a0f63851d4c7e2b9a06f3d58e1c7b42"
steps = ["{python} tools/build.py --release"]
artifacts = ["tools", "runtime.lock.json", "build/libs/*.jar"]

[inputs."engine.tar"]
repo = "Engine"
commit = "e4b8a1c03f9d27654a1b0c8e3d7f2a96b5c41e08"
artifacts = ["tools"]

[inputs."pins.tar"]
repo = "App"
commit = "9c1d4e7b2a0f63851d4c7e2b9a06f3d58e1c7b42"
steps = ["{python} tools/pins.py fetch --into build/pins"]
base = "build"                      # the archive holds pins/..., as run.sh unpacks it into the app's folder
artifacts = ["pins"]

[inputs."cache.tar"]                # made by hand: no recipe, only (once known) its sha256

# How a plan's game steps are written into the bundle: plan.env, the shell variables run.sh reads.
[steps]
file = "plan.env"
roles = { prepare = 1, play = "1+" }
same = ["name"]                     # one instance per bundle
files = [{ role = "prepare", param = "args", match = "*.jar", into = "jars", write = "remote" },
         { role = "play", param = "tour" }]

[steps.values]
NAME = "{prepare.name}"
SEED = "{prepare.seed|0}"
SCALE = "{prepare.scale|1}"
PREPARE_ARGS = "{prepare.args|}"
TOURS = "{play.tour}"
LABELS = "{play.label|play.id}"
"OPTIONS_{n}" = "{play.options|}"
WINDOW = "{values.window|1920x1080}"
GPU = "1"

# The fetched results each play step gets as outputs, named as a run of lab.play on the host names them.
[outputs]
"{play.label|play.id}-captures" = "results/{play.label|play.id}-captures"
"{play.label|play.id}-client-log" = "results/{play.label|play.id}-client-latest.log"
"{play.label|play.id}-play-log" = "results/{play.label|play.id}-play.log"
