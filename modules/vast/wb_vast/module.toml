[module]
name = "vast"
version = "0.1.0"
summary = "Rent GPU machines on Vast.ai, run bundles on them, and record market prices and charges."
startup = "wb_vast.commands:reconcile"

[config]
api = { type = "string", default = "https://console.vast.ai/api/v0" }
image = { type = "string", default = "ubuntu:26.04", summary = "stock image a rental starts from (D21)" }
min_cores = { type = "float", default = 8, summary = "offers with fewer effective cores are refused: a small host can starve a build or a game of threads" }
poll_seconds = { type = "float", default = 20, min = 0.01 }
search_limit = { type = "int", default = 100, min = 10, max = 500, summary = "rows per search; every row counts against Vast's daily quota of 20,000" }
daily_rows = { type = "int", default = 20000, summary = "Vast's daily search-row quota (seen 2026-11-21)" }
market_share = { type = "float", default = 0.3, min = 0.0, max = 1.0, summary = "the market's share of the daily quota, paced over the UTC day; the rest is reserved for work" }
market_limit = { type = "int", default = 25, min = 5, max = 500, summary = "rows per card per snapshot; cards rotate across snapshots" }
ssh_retry_seconds = { type = "float", default = 10, min = 0.01 }
cards = { type = "list", items = "string", default = [], summary = "the cards offer lookups search and vast.market rotates through; none are built in" }
templates = { type = "object", default = {}, summary = "bundle templates by name, [modules.vast.templates.<name>]: a folder and its entry script, the input archives and their recipes, how a plan's game steps are written and which results become step outputs (every key: modules/vast/docs/templates.md)" }
root = { type = "string", default = "", summary = "the host folder a template's relative folder and its recipes' relative repositories are under (a shared config names them relatively)" }

[requires]
secrets = ["vast_api_key"]
module = ["ledger"]

[[command]]
name = "offers"
summary = "List rentable offers for a card (or every configured card); rents nothing."
handler = "wb_vast.commands:offers"
requires = { network = ["console.vast.ai:443"] }
params.gpu = { type = "string", default = "", summary = "a card; empty: every configured card" }
params.max_dph = { type = "money", unit = "USD/h", default = 0.30 }
params.driver_branch = { type = "string", pattern = "^R[0-9]{3}$", optional = true, summary = "e.g. R580" }
params.min_cores = { type = "float", default = 0 }
result.offers = { type = "list" }

[[command]]
name = "market"
summary = "Record a market snapshot: every listed offer of the configured cards, asked three times."
handler = "wb_vast.commands:market_snapshot"
requires = { network = ["console.vast.ai:443"] }
params.max_dph = { type = "money", unit = "USD/h", default = 2.0 }
params.gpus = { type = "list", items = "string", default = [] }

[[command]]
name = "charges"
summary = "Record the account's billed charges of the last days."
handler = "wb_vast.commands:charges"
requires = { network = ["console.vast.ai:443"] }
params.days = { type = "int", default = 7, min = 1, max = 90 }

[[command]]
name = "instances"
summary = "List the account's rented machines."
handler = "wb_vast.commands:instances"
requires = { network = ["console.vast.ai:443"] }

[[command]]
name = "destroy"
summary = "Destroy one rented machine (stops its billing)."
handler = "wb_vast.commands:destroy"
requires = { network = ["console.vast.ai:443"] }
params.instance = { type = "string", pattern = "^[0-9]+$" }

[[command]]
name = "keys"
summary = "List the account's SSH keys."
handler = "wb_vast.commands:keys"
requires = { network = ["console.vast.ai:443"] }

[[command]]
name = "rent"
summary = "Rent one offer, run a bundle on it, fetch the results, destroy it."
handler = "wb_vast.commands:rent"
quote = "wb_vast.commands:quote_rent"
spends = true
cancel_grace = "3m"
requires = { secrets = ["vast_ssh_key"], network = ["console.vast.ai:443"], binary = ["ssh", "scp", "ssh-keygen"] }
resources = { cpu = 0.5 }
params.offer = { type = "string", pattern = "^[0-9]+$" }
params.bundle = { type = "path.in", summary = "a folder holding bundle.toml" }
params.max_dph = { type = "money", unit = "USD/h", max = 5.0 }
params.cap = { type = "duration", default = "90m", min = "10m", max = "8h" }
params.min_cores = { type = "float", optional = true }
params.disk = { type = "int", optional = true, min = 16, max = 500 }
result.instance = { type = "string" }
result.outcome = { type = "enum", values = ["completed", "partial", "failed"] }

[[command]]
name = "probe"
summary = "Rent one offer briefly to check it gives OpenGL 4.6 through VirtualGL, then destroy it."
handler = "wb_vast.commands:probe"
quote = "wb_vast.commands:quote_probe"
spends = true
requires = { network = ["console.vast.ai:443"] }
params.offer = { type = "string", pattern = "^[0-9]+$" }
params.max_dph = { type = "money", unit = "USD/h", max = 2.0 }

[[command]]
name = "bundle-check"
summary = "Check a bundle (manifest, pinned files, size) and show the bootstrap it would get; rents nothing."
handler = "wb_vast.commands:bundle_check"
params.bundle = { type = "path.in" }

[[command]]
name = "bundle-launch"
summary = "Make a rental bundle from a launch file alone: every member and runtime file by SHA-256 from the Store, the platform's Linux archive of the launch's JDK, the overlays and trusted configure script by id, Workbench's own lab.build and lab.run code and a run script that builds the instance and plays one tour session headless, writing session.json. Checked against the launch file, with a manifest of every file's SHA-256. Rents nothing."
handler = "wb_vast.commands:bundle_launch"
runs_on = ["host"]
requires = { binary = ["git"] }
resources = { cpu = 0.5 }
timeout = "30m"
params.launch = { type = "path.in", summary = "the launch file (lab.resolve's launch.json)" }
params.tour = { type = "path.in", summary = "the tour the rental plays: a list of {label, x, y, z, yaw, pitch} or {viewDistance, views}" }
params.name = { type = "string", optional = true, summary = "the bundle's name; default: <project>-<launch>-<the launch file's SHA-256, 12 digits>" }
params.window = { type = "string", default = "1920x1080", pattern = "^[0-9]+x[0-9]+$", summary = "the client's window on the rental" }
params.gpu = { type = "bool", default = true, summary = "draw through VirtualGL on the rented GPU; false: software OpenGL" }
params.eula = { type = "bool", default = false, summary = "true records that the requester accepts the Minecraft EULA for the rental's instance; [lab] eula = true does so for every bundle of the machine. Without it vast.rent refuses the bundle" }
params.params = { type = "object", default = {}, summary = "values over the launch's params for the rental's instance, as lab.build takes them" }
params.limit = { type = "duration", default = "90m", min = "5m", max = "8h", summary = "the session's limit on the rental" }
params.disk = { type = "int", default = 32, min = 16, max = 500, summary = "the rental's disk in GB" }
params.purpose = { type = "string", default = "calibration", summary = "recorded with the rental" }
result.bundle = { type = "string" }
result.problems = { type = "list" }

[[command]]
name = "bundle"
summary = "Make a rental bundle from a template in config, filled with a plan's game steps and the template's input archives; checked, with a manifest of every file's SHA-256. Rents nothing."
handler = "wb_vast.commands:bundle"
requires = { config = ["modules.vast.templates"] }
resources = { cpu = 0.5 }
params.template = { type = "string", default = "", summary = "a name under [modules.vast.templates]; empty: the only one configured" }
params.steps = { type = "list", items = "object", default = [], summary = "the game steps to write as the template declares, as plan.run passes them: id, command, role, params" }
params.values = { type = "object", default = {}, summary = "values the template's steps file may use as {values.<key>}; plan.run passes its [rental] table" }
params.plan = { type = "path.in", optional = true, summary = "instead of steps: a folder already holding the template's steps file and the files it names, taken as it is" }
params.lab = { type = "path.in", optional = true, summary = "the folder of the template's input archives (vast.lab-inputs makes them, with receipts)" }
params.name = { type = "string", optional = true, summary = "the bundle's name; default: the plan folder's, else the template's" }
params.dry_run = { type = "bool", default = false, summary = "check the template, the steps and the inputs (against their pins and receipts, unhashed) and write nothing" }
result.bundle = { type = "string" }
result.problems = { type = "list" }
result.outputs = { type = "list" }

[[command]]
name = "lab-inputs"
summary = "Build the input archives a template declares, each from its pinned commit in a throwaway clean tree by its recipe, with a receipt; archives the pin cache holds are taken from it. Rents nothing."
handler = "wb_vast.commands:lab_inputs"
requires = { config = ["modules.vast.templates"], binary = ["git"] }
resources = { cpu = 2, mem_gb = 4 }
timeout = "3h"
params.template = { type = "string", default = "", summary = "a name under [modules.vast.templates]; empty: the only one configured" }
params.inputs = { type = "list", items = "string", default = [], summary = "the inputs to build, by file name; empty: every input with a recipe" }
params.cached = { type = "bool", default = true, summary = "take an archive the pin cache holds (by its pinned SHA-256, or as an earlier build of the same recipe made it); false: build again to check it reproduces" }
params.keep = { type = "bool", default = false, summary = "keep the clean trees after the run" }
result.archives = { type = "list" }
