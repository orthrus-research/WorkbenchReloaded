[module]
name = "lab"
version = "0.1.0"
summary = "Game sessions: native client sessions on the host through wb-host (instances, the GPU lease, the lab home), and headless dedicated-server sessions in the container."

[config]
launcher = { type = "string", default = "", summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
python = { type = "string", default = "", summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
profile = { type = "object", default = {}, summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
snapshots = { type = "string", default = "", summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
keep_worlds = { type = "list", items = "string", default = [], summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
keep_instances = { type = "list", items = "string", default = [], summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
scripts = { type = "list", items = "string", default = [], summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
profiles = { type = "object", default = {}, summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
environments = { type = "object", default = {}, summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
python_cache = { type = "string", default = "", summary = "retired: read by nothing since the instance profile's commands went (wb play builds from a launch file); remove it from this machine's config" }
metadata = { type = "string", default = "", summary = "where lab.assemble reads a component an instance carries no patch for: a URL template with {uid} and {version} (a launcher metadata server, or a mirror)" }
asset_base = { type = "string", default = "https://resources.download.minecraft.net/", summary = "where lab.assemble downloads asset objects from, by <first two hex digits>/<SHA-1>" }
runtime_cache = { type = "string", default = "", summary = "where lab.assemble keeps libraries, client JARs and assets, shared by every runtime; empty: <state>/cache/runtime (put it under a configured root for the host to use what it holds)" }
library_candidates = { type = "list", items = "string", default = [], summary = "folders lab.assemble searches by file name for a library with the SHA-1 its metadata names before downloading it (a Gradle cache, a launcher's libraries)" }
asset_candidates = { type = "list", items = "string", default = [], summary = "asset folders (holding objects/ and indexes/) lab.assemble searches before downloading" }
sessions = { type = "string", default = "", summary = "where lab.run keeps its sessions, one folder each with session.json; empty: <lab home>/sessions" }
instances = { type = "string", default = "", summary = "where lab.build keeps its templates (.store) and the instances made from them, one folder each; empty: <lab home>/instances" }
runtime_hosts = { type = "list", items = "string", default = [], summary = "the hosts lab.build downloads a runtime file (runtime.files of a launch) from, every redirect included; empty: [modules.ci] store_hosts" }
runtime_candidates = { type = "list", items = "string", default = [], summary = "folders lab.build searches by file name for a runtime file with the SHA-256 the launch names before downloading it" }
pack_cache = { type = "string", default = "", summary = "where lab.pack keeps pack files by SHA-512, shared by every pack; empty: <state>/cache/packs" }
pack_hosts = { type = "list", items = "string", default = ["cdn.modrinth.com", "github.com", "raw.githubusercontent.com", "gitlab.com"], summary = "the hosts lab.pack downloads from (by default the ones the Modrinth pack format allows)" }
curseforge_api = { type = "string", default = "https://api.curseforge.com", summary = "the CurseForge API lab.pack asks about a CurseForge pack's files (with the secret curseforge_api_key)" }
curseforge_hosts = { type = "list", items = "string", default = ["edge.forgecdn.net", "mediafilez.forgecdn.net"], summary = "the hosts a CurseForge pack's files may be downloaded from" }

[[command]]
name = "gpu"
turn = true
summary = "The host's GPU, driver and lease, as wb-host sees them."
handler = "wb_lab.commands:gpu"
runs_on = ["host"]

[[command]]
name = "resolve"
summary = "Resolve a launch once into launch.json: the [launch.<name>] of the project.toml at a worktree's HEAD, every member taken by SHA-256 from the worktree's set revision (a line, a hold or a third entry) or, for the project itself, from the Store by the tree CI built; the base project's [launch.<name>] and the tree id of its launch/ overlay at the commit the set names for it (its branch in its home repository when it has no line), or, when that is another product's launch, that launch inherited (members, base, configure, overlays, params, JVM arguments, tour rules) with the launch's own added; the product's configure script and launch/ tree at its commit; refuses a member the set or the Store lacks and two builds of one mod id. Written to <worktree>/.local/launch/<name>.json unless out is given."
handler = "wb_lab.resolve:resolve_command"
runs_on = ["host"]
timeout = "5m"
params.folder = { type = "path.in", digest = "git", summary = "the product's worktree (clean: a launch describes a commit CI built)" }
params.launch = { type = "string", default = "default", pattern = "^[A-Za-z0-9._-]+$", summary = "the launch's name, [launch.<name>] in project.toml" }
params.out = { type = "string", default = "", summary = "where to write launch.json; empty: <worktree>/.local/launch/<name>.json" }
params.stand_ins = { type = "object", default = {}, summary = "{project: commit}: these projects stand in for their lines, each member and base read at that commit and its artifacts taken from the Store by its tree (refused where CI has not built it); recorded in launch.json's stand_ins and its members' kind" }
result.launch = { type = "string" }
result.set = { type = "string" }
result.commit = { type = "string" }
result.members = { type = "object" }

[[command]]
name = "turn"
summary = "Run host routines in order under ONE GPU lease; stop at the first failure."
handler = "wb_lab.commands:turn"
runs_on = ["host"]
resources = { gpu = true, quiet = true }
timeout = "6h"
cancel_grace = "2m"
params.steps = { type = "list", items = "object", summary = "[{id, command, params}] of lab host routines" }
params.continue_on_finding = { type = "bool", default = false }

[[command]]
name = "install-server"
summary = "Install a dedicated server with its loader's own installer, the installer pinned by SHA-256: every installed file is kept by size and SHA-256 with a receipt, and the folder is a stopped server for lab.server and lab.session. The EULA is accepted only when the request says eula = true."
handler = "wb_lab.install:install_server"
resources = { cpu = 1 }
timeout = "2h"
params.installer = { type = "path.in", summary = "the loader's installer JAR" }
params.sha256 = { type = "sha256", summary = "its SHA-256: another installer is refused before anything runs" }
params.jdk = { type = "string", default = "26", summary = "the JDK that runs the installer, as Workbench names them" }
params.launch = { type = "list", items = "string", default = ["{java}", "-jar", "{installer}", "--installServer", "{target}"], summary = "the installer's command line: {java}, {installer} and {target} (the folder it installs into) are filled in" }
params.eula = { type = "bool", default = false, summary = "true writes eula.txt, recording that the requester accepts the Minecraft EULA for this folder" }
params.timeout = { type = "duration", default = "30m", summary = "the installer is stopped after this" }
result.server = { type = "string", optional = true }
result.files = { type = "int", optional = true }

[[command]]
name = "pack"
summary = "Get a release-exact modpack from its pack file: a Modrinth pack (.mrpack), each file for the chosen side checked by its SHA-512, or a CurseForge pack (manifest.json), each file found through the CurseForge API (secret curseforge_api_key) and checked by its SHA-1; downloads only from allowed hosts, a shared cache, the overrides laid over, with a receipt. Starts nothing."
handler = "wb_lab.pack:pack"
resources = { cpu = 1 }
timeout = "2h"
params.pack = { type = "path.in", summary = "the pack file: a Modrinth .mrpack or a CurseForge .zip" }
params.side = { type = "enum", values = ["client", "server"], default = "client", summary = "the side the files are for" }
params.optional = { type = "bool", default = false, summary = "take the files the pack marks optional too" }
result.pack = { type = "string", optional = true }
result.files = { type = "int", optional = true }

[[command]]
name = "assemble"
summary = "Assemble a game runtime from a launcher instance's metadata: libraries by the target's rules, natives, the client JAR and assets fetched against their SHA-1 into a shared cache (or found in candidate folders), the natives unpacked, and runtime.json naming the main class, arguments and class path. Starts nothing."
handler = "wb_lab.assemble:assemble"
resources = { cpu = 1 }
timeout = "2h"
params.instance = { type = "path.in", summary = "a Prism or MultiMC instance folder, or the .zip it exports (mmc-pack.json, patches/, libraries/)" }
params.system = { type = "enum", values = ["", "windows", "linux", "osx"], default = "", summary = "the system the runtime is for; empty: the one the job runs on" }
params.arch = { type = "enum", values = ["", "x86_64", "aarch64", "x86"], default = "", summary = "its architecture; empty: the machine's" }
params.assets = { type = "bool", default = true, summary = "fetch the asset index and its objects too" }
params.game = { type = "bool", default = false, summary = "also copy the instance's own game folder (mods, config, packs, scripts, options.txt; never worlds or logs), each file listed by SHA-256" }
result.runtime = { type = "string", optional = true }
result.main_class = { type = "string", optional = true }
result.libraries = { type = "int", optional = true }
result.problems = { type = "list" }

[[command]]
name = "build"
summary = "Build a game instance from a resolved launch file (lab.resolve's launch.json) and nothing else: the runtime (the server by its installer on the launch's JDK from the Store, the client from its launcher instance, every runtime file by SHA-256), each member's Store file hashed again and placed by side, the base's files, JVM profile and overlay folder (exported by the tree id the launch names), the product's overlay and its configure script for a trusted project, one priming start of the server when the launch asks for it (the spawn generated and settled in the template), and instance.json naming every file by SHA-256 relative to {instance}, {cache} and {jdk:N} with the server's and client's command lines. One template per launch file, base and parameters; instances are hard-linked from it, and an instance replaced keeps its played world among the kept worlds first. No game is played."
handler = "wb_lab.instance:build"
runs_on = ["host"]
timeout = "2h"
params.launch = { type = "path.in", summary = "the launch file (wb run lab.resolve folder=<worktree> writes <worktree>/.local/launch/<name>.json); its runtime.files name the runtime's own files" }
params.name = { type = "string", pattern = "^[a-z0-9][a-z0-9._-]*$", summary = "the instance's name: its folder under [modules.lab] instances" }
params.params = { type = "object", default = {}, summary = "values over the launch's params (seed, and what the configure script reads), each of the type the launch declares for it; they are part of the template's key" }
params.eula = { type = "bool", default = false, summary = "true writes eula.txt, recording that the requester accepts the Minecraft EULA for this instance; [lab] eula = true does so for every instance of the machine" }
params.configure = { type = "path.in", optional = true, summary = "a Python file whose configure(instance, launch, params, placed) makes a launched product's own changes after the base, in place of the launch's configure script (launch/configure.py at the launch's commit); its bytes are part of the template's key; either is refused unless the launch's project is in [lab] trusted" }
params.fresh = { type = "bool", default = false, summary = "make the instance again: replaces one of this name built from this or another template, its played world kept among the lab's kept worlds first" }
params.prime = { type = "enum", values = ["", "yes", "no"], default = "", summary = "the template's priming start, one server start that generates the spawn and settles so instances start warm: empty, as the launch asks (prime in launch.json); yes or no instead. It needs the EULA accepted, and is part of the template's key" }
params.replace = { type = "bool", default = false, summary = "replace an instance of this name built from another template (another launch file or other parameters), its played world kept among the lab's kept worlds first; false refuses it (wb play passes true)" }
params.store = { type = "path.in", optional = true, summary = "a folder holding the launch's Store files (files/<sha256>/<name> and jdks/<build>/<system>) in place of the Store the launch file names, as a rental's bundle carries them; the launch file's bytes, and so the template's key, stay the same" }
params.sources = { type = "path.in", optional = true, summary = "a folder holding the trees and blobs the launch file names by id (<id>/ for an overlay, <id>/<file> for a configure script), in place of exporting them from the projects' repositories, as a rental's bundle carries them" }
result.instance = { type = "string" }
result.template = { type = "string" }
result.reused = { type = "bool" }
result.built = { type = "bool" }

[[command]]
name = "run"
summary = "One session of an instance lab.build made, from its receipt (instance.json) alone, under the GPU lease: open (a person plays; console lines appended to the session's commands.txt go to the server, and its 'client <action> [<JSON>]' lines to the client's fixture through the session's client channel, the {channel} a launch's JVM arguments name), tour (the launch's tour rules drive the game through a tour's views, each captured and filed by label), measure (a tour that is evidence: quiet, on a fresh copy of the template, only for the launch file named) or driver (the launch's declared driver, a trusted project's program, gets the turn token, the lease, the instance.json path and, by the name [lab] env gives it, the runtime cache). Every cache, JDK and member file is hashed against the receipt first, and a JDK of another build is refused. The port, JVM options, window, views, edits, debugger and desktop (hidden: the client on a hidden Windows desktop that never takes the input) are the session's: they go into session.json with the member hashes, JDK build, GPU and driver, and never into the template. A stop waits at least 180 s for the server's own exit; a failure names the decisive line, the crash report and the next command."
handler = "wb_lab.run:run"
runs_on = ["host"]
resources = { gpu = true, quiet_if = ["kind=measure", "kind=driver"] }
timeout = "13h"
cancel_grace = "4m"
params.instance = { type = "string", pattern = "^[a-z0-9][a-z0-9._-]*$", summary = "the instance: its folder under [modules.lab] instances, made by lab.build" }
params.kind = { type = "enum", values = ["open", "tour", "measure", "driver"], default = "open", summary = "open, tour, measure or driver" }
params.tour = { type = "path.in", optional = true, summary = "tour and measure: the tour file, a list of {label, x, y, z, yaw, pitch[, commands]} or {viewDistance, views}" }
params.launch = { type = "path.in", optional = true, summary = "measure: the launch file the instance must have been built from" }
params.copy = { type = "bool", default = true, summary = "measure: play a fresh copy of the instance's template (false: the named instance itself)" }
params.driver = { type = "string", default = "", summary = "driver: the name of a driver the launch declares (drivers.<name>.command)" }
params.driver_root = { type = "path.in", optional = true, digest = "git", summary = "driver: the folder its {root} and its working folder are, the project's export or checkout" }
params.port = { type = "int", default = 0, min = 0, max = 65535, summary = "the server's port; 0: a free one" }
params.jvm = { type = "list", items = "string", default = [], summary = "JVM options for this session: -X for both sides, client:-X or server:-X for one" }
params.view = { type = "object", default = {}, summary = "view distances by the base's view keys (horizontal, vertical, client_render)" }
params.edits = { type = "list", items = "string", default = [], summary = "the instance's own files changed for this session only: <server|client>/<file>:<key>=<value>" }
params.window = { type = "string", default = "", summary = "the client's window, WIDTHxHEIGHT; empty: the base's" }
params.debug = { type = "enum", values = ["", "client", "server", "both"], default = "", summary = "open JDWP on loopback for these sides, write attach/launch.json, and mark the session as not evidence" }
params.fresh_world = { type = "bool", default = false, summary = "play on a fresh world: every part of the instance's world is removed (link-first) before the server starts" }
params.keep_world = { type = "bool", default = false, summary = "play on the world set aside, or the instance's own whatever build wrote it, or the newest kept world of the world key from any build; without it or fresh_world, the instance's world of the session's world key and writer build, else the kept world of them, else a fresh one" }
params.limit = { type = "duration", default = "4h", min = "10s", max = "12h", summary = "an open session or a driver is stopped after this" }
params.jdk = { type = "path.in", optional = true, summary = "a JDK home to run on instead of the Store's; it must be the receipt's build" }
params.session = { type = "string", default = "", summary = "the session's id; empty: a new one" }
params.no_rebuild = { type = "bool", default = false, summary = "the play did not rebuild members compiled against other bytes: the session is not evidence" }
params.desktop = { type = "enum", values = ["", "hidden"], default = "", summary = "hidden: start the client on a hidden Windows desktop of its own, where it runs and draws but never takes the input; a driver gets the desktop's name (WB_DESKTOP, {desktop}) and the launcher that starts its client there (WB_DESKTOP_LAUNCHER, {desktop_launcher}); session.json records the desktop and its windows" }
result.session = { type = "string" }
result.folder = { type = "string" }
result.instance = { type = "string" }
result.evidence = { type = "bool" }
result.state = { type = "string" }

[[command]]
name = "send"
summary = "Send one request to a running session's client fixture through the session's client channel (<session>/channel: request.json in, responses/<id>.json back, one at a time) and wait for its answer. The launch names the folder to its fixture mod as {channel}; what an action means is the fixture's."
handler = "wb_lab.run:send"
runs_on = ["host"]
timeout = "10m"
params.session = { type = "string", pattern = "^[0-9]{8}-[0-9]{6}-[0-9a-f]{6}$", summary = "the running session's id" }
params.action = { type = "string", pattern = "^[A-Za-z0-9_.:-]+$", summary = "the request's action, as the fixture names them" }
params.values = { type = "object", default = {}, summary = "the request's other fields" }
params.timeout = { type = "int", default = 45, min = 1, max = 600, summary = "seconds to wait for the answer" }
result.session = { type = "string" }
result.id = { type = "string" }
result.ok = { type = "bool" }
result.answer = { type = "object" }
result.file = { type = "string" }

[[command]]
name = "keep"
summary = "Keep a session: retention never removes the session, its instance, its template or its launch file."
handler = "wb_lab.run:keep"
runs_on = ["host"]
params.session = { type = "string", pattern = "^[0-9]{8}-[0-9]{6}-[0-9a-f]{6}$", summary = "the session's id" }
params.reason = { type = "string", summary = "why it is kept" }

[[command]]
name = "freeze"
summary = "Keep the old route's instances (folders with no instance.json, as the project launchers prepared them) as read-only evidence: a manifest of every file by size, time and SHA-256, the world imported into the lab's kept worlds by its world key (seed, layout scale, the definitions' SHA-256, the Cubature JAR that wrote it), tours/ and runs/ copied into one session kept with lab.keep, then every file marked read-only. Without apply it only inventories. Never moves, deletes or follows a link; a folder reached through a link is refused. lab.thaw is the undo."
handler = "wb_lab.legacy:freeze"
runs_on = ["host"]
timeout = "6h"
params.folder = { type = "path.in", digest = "none", summary = "a legacy instance, or the folder holding them (a checkout's .local/cubic-standalone); recorded by its path, since the freeze writes its own manifest of every file" }
params.apply = { type = "bool", default = false, summary = "false: inventory only (counts, sizes, world keys, what would be imported), hashing nothing" }
params.hash_limit = { type = "int", default = 256, min = 0, summary = "files larger than this many MiB are recorded by size and time only" }
result.instances = { type = "list" }
result.skipped = { type = "list" }
result.bytes = { type = "int" }
result.applied = { type = "bool" }

[[command]]
name = "thaw"
summary = "Undo lab.freeze: clear the read-only mark from exactly the files a freeze's manifest says it marked, each only while its size and time are the ones recorded. The imported world and session are copies and stay."
handler = "wb_lab.legacy:thaw"
runs_on = ["host"]
timeout = "1h"
params.folder = { type = "path.in", digest = "none", summary = "a frozen legacy instance, or the folder holding them; recorded by its path, since the freeze's manifests say what was read" }
result.instances = { type = "list" }

[[command]]
name = "server"
summary = "Run a dedicated server from a copy of a stopped server folder: wait until it is ready, send console commands, let it run for ticks, seconds or until a line, stop it gracefully, and keep its console, new crash reports, chosen files and a receipt."
handler = "wb_lab.server:server"
resources = { cpu = 2, mem_gb = 4 }
timeout = "24h"
cancel_grace = "2m"
params.server = { type = "path.in", summary = "a stopped server folder (its JARs, mods, config and world); the run uses a copy, so it is never written" }
params.jdk = { type = "string", default = "8", summary = "the JDK that runs it, as Workbench names them (8, 17, 25); empty: none, for a launch that names no {java}" }
params.jar = { type = "string", default = "", summary = "the server JAR for {jar}: a glob relative to the folder that matches one file; empty: the folder's only top-level JAR" }
params.jvm_args = { type = "list", items = "string", default = [], summary = "JVM options for {jvm_args}; {port}, {ticks} and {server} are filled in" }
params.launch = { type = "list", items = "string", default = ["{java}", "{jvm_args}", "-jar", "{jar}", "nogui"], summary = "the server's command line, run in the copy: {java}, {jvm_args} (an item of its own: the options), {jar}, {server} (the copy), {port}, {ticks}" }
params.exclude = { type = "list", items = "string", default = [], summary = "globs of the folder left out of the copy: logs, or world for a fresh one" }
params.files = { type = "path.in", optional = true, summary = "a folder laid over the copy: config, scripts, datapacks" }
params.mods = { type = "list", items = "path.in", default = [], summary = "JARs added to the copy's mods folder" }
params.properties = { type = "object", default = {}, summary = "server.properties values for the copy ({port} is filled in); unless it names server-port, the copy listens on a free port" }
params.ready = { type = "list", items = "string", default = ['Done \([^)]*\)! For help'], summary = "regular expressions; the server is ready once each has matched a console line" }
params.ready_timeout = { type = "duration", default = "10m", max = "2h" }
params.commands = { type = "list", items = "any", default = [], summary = "console commands sent once it is ready, in order: a string, or {send, expect, timeout}, where expect is a regular expression the reply must match" }
params.reply_timeout = { type = "duration", default = "60s", max = "1h", summary = "how long an expected reply, or the game time, may take" }
params.ticks = { type = "int", default = 0, min = 0, summary = "then run until this many game ticks have passed, by the server's own game time (tick_query)" }
params.seconds = { type = "duration", default = 0, max = "20h", summary = "then run this long" }
params.until = { type = "list", items = "string", default = [], summary = "then run until a console line matches one of these regular expressions; the run ends at the first of ticks, seconds and until" }
params.run_timeout = { type = "duration", default = "1h", max = "20h", summary = "the longest a run for ticks or until may take; reaching it is a finding" }
params.tick_query = { type = "string", default = "time query gametime", summary = "the console command that prints the game time" }
params.tick_reply = { type = "string", default = '[Tt]ime is (\d+)', summary = "its reply; group 1 is the game time in ticks" }
params.save = { type = "bool", default = false, summary = "send save-all, and wait for it to finish, before stopping" }
params.stop = { type = "list", items = "string", default = ["stop"], summary = "the console commands that stop the server" }
params.grace = { type = "duration", default = "2m", max = "30m", summary = "how long it may take to stop before it is killed (a finding)" }
params.keep = { type = "list", items = "string", default = [], summary = "globs, relative to the copy, of what to keep from it under files/ (world, logs/*.log); the console, new crash reports and the receipt are always kept" }
result.ready = { type = "bool" }
result.ended = { type = "string" }
result.ticks = { type = "int" }
result.stopped = { type = "string" }
result.exit = { type = "int" }
result.receipt = { type = "string" }

