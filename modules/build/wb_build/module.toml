[module]
name = "build"
version = "0.1.0"
summary = "Builds with receipts and reproducible archives."

[[command]]
name = "receipt"
summary = "Run a build and record what it was built from and what it produced."
handler = "wb_tools.adapter:run_tool"
aliases = ["tools.receipt"]
params.argv = { type = "list", items = "string", default = [], summary = "the tool's own arguments; absolute host paths are translated" }
params.cwd = { type = "path.in", optional = true, digest = "git", summary = "run in this folder (a project checkout)" }

[[command]]
name = "archive"
summary = "Pack a file tree into a byte-reproducible ZIP (sorted entries, one timestamp and mode) with a manifest and a .sha256; variants freeze #define values in named files."
handler = "wb_build.archive:archive"
resources = { cpu = 1 }
params.root = { type = "path.in", summary = "the file tree to pack" }
params.name = { type = "string", summary = "the archive's name: <name>.zip, <name>.zip.sha256 and the manifest <name>.json" }
params.include = { type = "list", items = "string", default = ["**"], summary = "globs of the files to pack, relative to root (** crosses folders; a folder's glob takes all below it)" }
params.exclude = { type = "list", items = "string", default = [], summary = "globs of the files to leave out (.git always is)" }
params.tracked = { type = "bool", default = false, summary = "only files git tracks (root in a checkout)" }
params.timestamp = { type = "string", default = "1980-01-01T00:00:00", summary = "the modification time every entry carries" }
params.compression = { type = "enum", values = ["deflate", "stored"], default = "deflate", summary = "deflate (level 9; the bytes also depend on zlib's version) or stored" }
params.variants = { type = "object", default = {}, summary = "more archives, <name>-<variant>.zip: {variant: {file: {NAME: value}}}, a value a number, on or off" }
result.sha256 = { type = "string" }
result.files = { type = "int" }
