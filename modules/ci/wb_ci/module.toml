[module]
name = "ci"
version = "0.1.0"
summary = "Run a project's jobs, gate pushes on them, and keep commits clean."

[config]
projects_root = { type = "string", default = "", summary = "the host folder relative project repos are under (a shared config names repos relatively)" }
jdk = { type = "string", default = "26", summary = "the JDK major a project's jobs get as JAVA_HOME unless the project names another" }
excludes = { type = "list", items = "string", default = [], summary = "ignore patterns a working-tree run applies, standing in for the host's own excludes file" }
tool_env = { type = "object", entries = "string", default = {}, summary = "environment for ci.scrub and ci.actions, the absorbed tools: e.g. ORTHRUS_SCRUB_TERMS_FILE and ORTHRUS_SCRUB_RULES_FILE, a private terms file and rules file kept in the machine's config folder (in the container under /etc/wb), never in a repository" }
git_config = { type = "object", default = {}, summary = "the host's system and global git settings a working-tree run applies, by key (core.autocrlf, ...), for a container that cannot read them; the repository's own config still wins. Empty: git's own config" }
workdir = { type = "string", default = "", summary = "where clean trees are built; empty: <state>/ci/trees" }
records = { type = "string", default = "", summary = "old: CI's records are <out>/ci/records under [paths] out; read for one more release (a container path in an rw root), then the key goes; empty: <out>/ci/records, or <state>/ci/records without [paths] out" }
gradle_home = { type = "string", default = "", summary = "a Gradle home that survives the container, whose init.d serves toolchain's rescue repository and substitutions to every build (written each run); empty: <state>/cache/gradle" }
store = { type = "string", default = "", summary = "old: the Store (what producing jobs built, by SHA-256 and by project and tree) is <out>/store under [paths] out; read for one more release, then the key goes; empty: <out>/store, or <state>/store without [paths] out" }
store_hosts = { type = "list", items = "string", default = [], summary = "the hosts a URL the Set names may be fetched from (platform JDKs, Gradle, third-party files); a URL on any other host is refused" }
pin_cache = { type = "string", default = "", summary = "old: the pin cache (pinned files by SHA-256, WB_PIN_CACHE in every job) is <out>/cache/pins under [paths] out; read for one more release, then the key goes; empty: <out>/cache/pins, or <state>/cache/pins without [paths] out" }
python_cache = { type = "string", default = "", summary = "where projects' Python environments are cached by requirements; empty: <state>/cache/python" }

[config.projects]
type = "object"
default = {}
summary = "the projects ci runs, by name, each a table of the keys below; an unknown key is refused at load"

[config.projects.entries]
type = "object"

[config.projects.entries.fields]
repo = { type = "string", optional = true, summary = "its checkout as the host names it, under a configured root (only ever read); relative: under projects_root" }
config = { type = "string", optional = true, summary = "its jobs file in the tree (default: project.toml, else actions.toml)" }
jdk = { type = "string", optional = true, summary = "the JDK major its jobs get as JAVA_HOME (default: [modules.ci] jdk); empty: none" }
env = { type = "object", entries = "string", optional = true, summary = "more environment for every job, by variable" }
python = { type = "list", items = "string", optional = true, summary = "its jobs' {python}: an environment built from these requirements files (default: project.toml's [project] python)" }
workflow = { type = "string", optional = true, summary = "kept for older config; the jobs file names its own workflow" }
gate = { type = "bool", optional = true, summary = "false: its pushes are only scrubbed, never refused for a missing pass" }

[[command]]
name = "run"
summary = "Run a project's jobs from a clean clone (pinned repositories at their pins), keeping the records in Workbench; their Gradle builds get toolchain's rescue repository."
handler = "wb_ci.commands:run"
requires = { binary = ["git"], module = ["toolchain"] }
# One run of a project at a time, so two never interleave their writes to the project's Store index.
resources = { cpu = 4, mem_gb = 8, locks = ["ci:{project}"] }
timeout = "3h"
params.project = { type = "string", summary = "a name under [modules.ci.projects]" }
params.commit = { type = "string", default = "HEAD", summary = "the commit to run; worktree: the checkout's working tree as it would be committed" }
params.workflow = { type = "string", default = "", summary = "a workflow or job of the jobs file (default: its workflow)" }
params.jobs = { type = "list", items = "string", default = [], summary = "more workflows or jobs" }
params.if_needed = { type = "bool", default = true, summary = "skip jobs that already passed for these trees" }
params.keep_going = { type = "bool", default = false }
params.keep = { type = "bool", default = false, summary = "keep the clean trees after the run" }
params.checkout = { type = "path.in", optional = true, digest = "git", summary = "with commit=worktree: another checkout of the project's repository (a linked worktree) whose working tree to run" }
params.dry_run = { type = "bool", default = false }
params.stand_ins = { type = "object", default = {}, summary = "{project: tree}: stand-ins, each project's files as CI built them for that tree; a run with stand-ins records no pass" }
params.set = { type = "string", default = "", summary = "the Set revision {gradle} builds against (the worktree's .set); empty: the head wb last exported" }
params.cold = { type = "bool", default = false, summary = "build every job again: no earlier pass, input cache or Gradle build cache stands in (store.verify's rebuild)" }
result.commit = { type = "string" }
result.passed = { type = "list" }
result.failed = { type = "list" }

[[command]]
name = "host-run"
summary = "Run a project's host checks (on = \"host\", gpu = true) natively from a clean clone of its commit, only for a project in [lab] trusted: the gpu checks under one turn of the GPU lease, which their steps join; the records go where ci.run keeps them."
handler = "wb_ci.host:host_run"
runs_on = ["host"]
requires = { binary = ["git"] }
resources = { cpu = 1 }
timeout = "3h"
params.project = { type = "string", summary = "a name under [modules.ci.projects], listed in [lab] trusted" }
params.checks = { type = "list", items = "string", summary = "the host checks to run, by name (wb check splits them out of what it is asked)" }
params.commit = { type = "string", default = "HEAD", summary = "the commit to run; worktree: the checkout's working tree as it would be committed" }
params.if_needed = { type = "bool", default = true, summary = "skip checks that already passed for these trees" }
params.keep_going = { type = "bool", default = false }
params.keep = { type = "bool", default = false, summary = "keep the clean tree after the run" }
params.dry_run = { type = "bool", default = false }
params.checkout = { type = "path.in", optional = true, digest = "git", summary = "with commit=worktree: another checkout of the project's repository (a linked worktree) whose working tree to run" }
params.set = { type = "string", default = "", summary = "the Set revision {gradle} builds against; empty: the head wb last exported" }
params.stand_ins = { type = "object", default = {}, summary = "{project: tree}: stand-ins, as for ci.run; a run with stand-ins records no pass" }
result.commit = { type = "string" }
result.passed = { type = "list" }
result.failed = { type = "list" }
result.leased = { type = "list" }

[[command]]
name = "gate"
summary = "The push gate: refuse pushed commits whose trees have not passed every required job in Workbench's records."
handler = "wb_ci.commands:gate"
requires = { binary = ["git"] }
params.project = { type = "string" }
params.refs = { type = "list", items = "string", default = [], summary = "git's pre-push lines" }
params.refs_file = { type = "path.in", optional = true, summary = "a file of git's pre-push lines (what the hook passes)" }

[[command]]
name = "status"
summary = "What a project's commit has passed, and what it still needs before the gate lets it through."
handler = "wb_ci.commands:status"
requires = { binary = ["git"] }
params.project = { type = "string" }
params.commit = { type = "string", default = "HEAD" }

[[command]]
name = "hook"
summary = "Install (or remove) the pre-push hook that asks ci.gate, in the project's own checkout on the host."
handler = "wb_ci.commands:hook"
runs_on = ["host"]
params.project = { type = "string" }
params.install = { type = "bool", default = true, summary = "false: remove it, restoring any hook it replaced" }

[[command]]
name = "actions"
summary = "Run a project's build and test jobs in its own checkout, like a small CI (ci.run builds from clean trees instead)."
handler = "wb_tools.adapter:run_tool"
aliases = ["tools.actions"]
params.argv = { type = "list", items = "string", default = [], summary = "the tool's own arguments; absolute host paths are translated" }
params.cwd = { type = "path.in", optional = true, digest = "git", summary = "run in this folder (a project checkout)" }

[[command]]
name = "scrub"
summary = "Refuse commits carrying attribution trailers, tooling files, local paths or personal data."
handler = "wb_tools.adapter:run_tool"
aliases = ["tools.scrub"]
params.argv = { type = "list", items = "string", default = [], summary = "the tool's own arguments; absolute host paths are translated" }
params.cwd = { type = "path.in", optional = true, digest = "git", summary = "run in this folder (a project checkout)" }

[[command]]
name = "matrix"
summary = "Run a project's command once per Python on the host (a portability lane that needs no GPU): a clean clone of its commit, each interpreter by version (py launcher on Windows, pythonX.Y elsewhere) or path, an environment per version from requirements when given, and each version's result kept."
handler = "wb_ci.matrix:matrix"
runs_on = ["host"]
resources = { cpu = 1 }
timeout = "6h"
params.checkout = { type = "path.in", digest = "git", summary = "the project checkout" }
params.command = { type = "list", items = "string", summary = "the command, naming the interpreter as {python} ({python} -m unittest discover)" }
params.pythons = { type = "list", items = "string", summary = "the Pythons: versions (3.12) or interpreter paths" }
params.commit = { type = "string", default = "", summary = "the commit to clone; empty: the checkout's HEAD" }
params.requirements = { type = "list", items = "string", default = [], summary = "requirements files (relative to the checkout) each version's environment is made from; empty: the bare interpreters" }
params.timeout = { type = "duration", default = "30m", summary = "each version's run is stopped after this" }
params.folder = { type = "string", default = "", summary = "the folder the command runs in, relative to the checkout's top; empty: the top" }
params.env = { type = "object", default = {}, summary = "variables added to the command's environment, by name (PYTHONPATH = \"src\"); the record keeps their names only" }
result.commit = { type = "string", optional = true }
result.results = { type = "list", optional = true }

[[command]]
name = "store-verify"
summary = "Rebuild what the Store keeps for a project cold (a fresh clone, every job, no build cache) at the commit it was built from, and record whether each file came out to its SHA-256; a file that did not is a finding."
handler = "wb_ci.commands:store_verify"
aliases = ["store.verify"]
resources = { cpu = 1, mem_gb = 0.5 }
timeout = "12h"
params.project = { type = "string", summary = "a name under [modules.ci.projects]" }
params.commit = { type = "string", default = "", summary = "the build of this commit (a prefix will do); empty: every tree not yet verified" }
params.again = { type = "bool", default = false, summary = "rebuild trees already verified too" }
result.verified = { type = "list" }

[[command]]
name = "store-export"
summary = "Copy what the Store keeps (one project's, or its build of one commit) and every seeded file into a folder laid out as a Store, each file re-hashed on the way."
handler = "wb_ci.commands:store_export"
aliases = ["store.export"]
resources = { cpu = 1, mem_gb = 0.5 }
params.to = { type = "path.out", summary = "the folder to write (a backup place, or a folder to carry to another machine)" }
params.project = { type = "string", default = "", summary = "only this project's builds; empty: every project" }
params.commit = { type = "string", default = "", summary = "with project: only its build of this commit" }

[[command]]
name = "store-import"
summary = "Take a folder store-export wrote into the Store: every file re-hashed and refused unless it is its SHA-256, build records merged, seeded files' sources kept."
handler = "wb_ci.commands:store_import"
aliases = ["store.import"]
resources = { cpu = 1, mem_gb = 0.5 }
params.source = { type = "path.in", summary = "the folder store-export wrote" }

[[command]]
name = "land"
summary = "One landing under lock set: each commit descends from its line and has passed its gate checks, its files are found in the Store, the new set.json and commit body are composed and scrubbed, and the lock is held while wb land publishes with the caller's git."
handler = "wb_ci.land:land"
aliases = ["set.land"]
requires = { binary = ["git"] }
resources = { cpu = 1, mem_gb = 0.5, locks = ["set"] }
timeout = "1h"
params.landing = { type = "string", pattern = "^[A-Za-z0-9_-]{4,64}$", summary = "the landing's id, from wb land" }
params.base = { type = "string", pattern = "^[0-9a-f]{40}$", summary = "the Set revision validated against (exported by wb land)" }
params.projects = { type = "object", summary = "{name: {commit, branch?, url?}}: what lands" }
params.deadline = { type = "float", default = 600, min = 5, summary = "seconds the publish has to be confirmed" }
params.caller = { type = "string", default = "" }
params.holds = { type = "object", default = {}, summary = "{<project>:<artifact>[@<consumer>]: {commit, artifacts: {name: {sha256, file}}, reason, source}}: kept on another commit, with seeded bytes" }
params.drop_holds = { type = "list", items = "string", default = [], summary = "holds to remove" }
params.platform = { type = "object", default = {}, summary = "{key: value}: platform values to land (jdk.<major>=<build>, gradle=<version>, cleanroom=<version>, java, cleanroomgradle, cleanroom.lwjgl); every file a value names is fetched from an allowed host and kept" }
params.third = { type = "object", default = {}, summary = "{name: {module, repository, files: {kind: {sha256, classifier?}}, licence, mod_id}}: third-party files, fetched, checked and kept; without module and repository, {source, licence, mod_id, sha256?}: the one JAR in <out>/third/<name>/, seeded into the Store" }
result.state = { type = "string" }

[[command]]
name = "store-platform"
summary = "Fetch the platform a Set revision names into the Store: each JDK build for Linux and Windows and the Gradle distribution, by URL and SHA-256 from hosts in store_hosts only, kept by digest and unpacked into jdks/<build>/<os>/ and gradle/<version>/."
handler = "wb_ci.platform:fetch"
aliases = ["store.platform"]
resources = { cpu = 1, mem_gb = 1, locks = ["store-platform"] }
timeout = "2h"
params.revision = { type = "string", default = "", summary = "the Set revision; empty: the head wb last exported" }
params.only = { type = "list", items = "string", default = [], summary = "only these: a JDK major (26), major:os (8:windows) or gradle" }
params.unpack = { type = "bool", default = true }
result.fetched = { type = "list" }
