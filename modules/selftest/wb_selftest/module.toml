[module]
name = "selftest"
version = "0.1.0"
summary = "Exercises the core: echo, sleep, fail, a zero-cost approval, and a call into another command."

[config]
greeting = { type = "string", default = "hello" }

[[command]]
name = "echo"
summary = "Return the parameters, write them to a file, and record a measurement."
handler = "wb_selftest.commands:echo"
deterministic = true
params.text = { type = "string", default = "ping" }
params.times = { type = "int", default = 1, min = 1, max = 100 }
result.text = { type = "string" }
result.greeting = { type = "string" }

[[command]]
name = "sleep"
summary = "Sleep, reporting progress; cancellable."
handler = "wb_selftest.commands:sleep"
params.seconds = { type = "duration", default = "5s", max = "1h" }
resources = { cpu = 0.1 }

[[command]]
name = "fail"
summary = "End with the outcome asked for, to check outcome codes."
handler = "wb_selftest.commands:fail"
params.outcome = { type = "enum", values = ["finding", "usage", "environment", "crash"] }

[[command]]
name = "spend"
summary = "A zero-cost command that goes through quote, approval and re-quote like a rental."
handler = "wb_selftest.commands:spend"
quote = "wb_selftest.commands:spend_quote"
spends = true
params.price = { type = "money", unit = "USD/h", default = 0.0 }
params.raise_to = { type = "money", unit = "USD/h", optional = true, summary = "simulate a price rise at run time" }

[[command]]
name = "copy"
summary = "Copy an input file to the output folder (path translation and input hashing)."
handler = "wb_selftest.commands:copy"
deterministic = true
params.source = { type = "path.in" }

[[command]]
name = "sizes"
summary = "The byte sizes of several input files (a cached command over a list of paths)."
handler = "wb_selftest.commands:sizes"
deterministic = true
params.sources = { type = "list", items = "path.in" }
result.sizes = { type = "list" }

[[command]]
name = "checkout"
summary = "Name a checkout's HEAD commit (an input recorded by git, not by hashing its files)."
handler = "wb_selftest.commands:checkout"
params.repo = { type = "path.in", digest = "git" }
result.head = { type = "string" }

[[command]]
name = "count"
summary = "Count a folder's files itself (an input recorded by its path only, not hashed before the job)."
handler = "wb_selftest.commands:count"
params.folder = { type = "path.in", digest = "none" }
result.files = { type = "int" }

[[command]]
name = "chain"
summary = "Call selftest.echo through the daemon (as plans do)."
handler = "wb_selftest.commands:chain"
params.text = { type = "string", default = "chained" }

[[command]]
name = "host-echo"
summary = "Run on the Windows host under the GPU lease and report the turn token's presence."
handler = "wb_selftest.commands:host_echo"
runs_on = ["host"]
resources = { gpu = true }
params.text = { type = "string", default = "host" }

[[command]]
name = "quiet-echo"
summary = "Like echo, but a measurement: needs a quiet machine."
handler = "wb_selftest.commands:echo"
resources = { quiet = true }
params.text = { type = "string", default = "ping" }
params.times = { type = "int", default = 1, min = 1, max = 100 }

[[command]]
name = "nest"
summary = "Hold a CPU reservation, then call selftest.echo as a child job and wait for it (the shape of ci.run calling a helper)."
handler = "wb_selftest.commands:nest"
resources = { cpu = 1 }
params.text = { type = "string", default = "nested" }
params.hold = { type = "duration", default = "0s", max = "1m", summary = "wait this long before calling the child" }
params.inline = { type = "bool", default = false, summary = "call selftest.inline-echo inline instead of a child job" }
params.sleep = { type = "duration", default = "0s", max = "1m", summary = "the child is selftest.sleep for this long instead of echo" }

[[command]]
name = "inline-echo"
summary = "Like echo, but called inline by a running job, in that job's reservation."
handler = "wb_selftest.commands:echo"
inline = true
params.text = { type = "string", default = "ping" }
params.times = { type = "int", default = 1, min = 1, max = 100 }
result.text = { type = "string" }
result.greeting = { type = "string" }

[[command]]
name = "orphan"
summary = "Start a process that detaches from this job and outlives it unless the job's processes are killed when it ends."
handler = "wb_selftest.commands:orphan"
params.seconds = { type = "duration", default = "60s", max = "10m" }
result.pid = { type = "int" }

[[command]]
name = "tool"
summary = "Run a tool that sleeps, under a limit (a cached command, to check a run stopped at its limit is never cached)."
handler = "wb_selftest.commands:tool"
deterministic = true
params.seconds = { type = "float", default = 1.0, min = 0, max = 600 }
params.limit = { type = "float", default = 60.0, min = 0.1, max = 3600 }
