# Workbench's own checks: its test suite (tests/run_all.py, which wb deploy runs whole) in its four parts. The core
# and module suites drive the Windows host (its paths, processes and the host runner), so they are host checks, which
# wb check core modules runs on the host and wb deploy runs before every release; the gate is the two that run anywhere.
schema = 1
gate = ["generated", "engine"]

[project]
name = "workbench"
python = ["tests/requirements.txt"]

[checks.generated]
description = "lock files, envelope types and command tables match their sources; help keeps to the vocabulary"
steps = [["{python}", "-B", "tests/run_all.py", "--part", "generated"]]
inputs = ["image/*.py", "image/*.toml", "image/*.lock", "image/*.txt", "schema/**/*.py", "schema/**/*.json",
          "sdk/**/*.py", "sdk/**/*.ts", "sdk/**/*.java", "sdk/**/*.ps1", "sdk/**/*.psm1", "sdk/**/*.psd1",
          "modules/*/wb_*/module.toml", "README.md", "docs/*.md", "tools/*.py", "tests/run_all.py",
          "tests/test_command_tables.py", "tests/test_vocabulary.py"]

[checks.core]
description = "the core, the CLI and the host runner (tests/)"
on = "host"
steps = [["{python}", "-B", "tests/run_all.py", "--part", "core"]]

[checks.modules]
description = "every module's own tests"
on = "host"
steps = [["{python}", "-B", "tests/run_all.py", "--part", "modules"]]

[checks.engine]
description = "the vendored actions engine and tools"
steps = [["{python}", "-B", "tests/run_all.py", "--part", "engine"]]
inputs = ["modules/tools/**/*.py", "modules/tools/**/*.toml", "modules/tools/**/*.json", "tests/run_all.py"]
